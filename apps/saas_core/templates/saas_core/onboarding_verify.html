<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar organización | AppDanza</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-dark text-light"><main class="container py-5" style="max-width:640px"><h1>Verificación de correo</h1>
{% if completed %}<p>La organización fue creada. Revisa tu correo para establecer la contraseña de acceso.</p>{% elif error %}<p>{{ error }}</p>{% else %}<p>Crear {{ pending.academy_name }} como {{ pending.workspace_type }}.</p><form method="post">{% csrf_token %}<button class="btn btn-primary" type="submit">Confirmar y crear organización</button></form>{% endif %}<a class="d-block mt-4" href="/">Volver a AppDanza</a></main></body></html>
